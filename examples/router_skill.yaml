version: "1.0.0"
name: Content Router
description: Route content to the appropriate analyzer based on type.

inputs:
  content:
    type: string
    required: true
  content_type:
    type: string
    required: true
    description: One of "code", "text", or other

outputs:
  result:
    type: object

steps:
  - id: analyze
    uses: text.content.summarize                                         
    config:
      router:
        on: "inputs.content_type"
        cases:
          code: code.source.analyze
          text: text.content.summarize
        default: data.record.transform
    input_mapping:
      text: "inputs.content"
    output_mapping:
      result: "outputs.result"
